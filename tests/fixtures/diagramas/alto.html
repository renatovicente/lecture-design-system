<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Diagrama alto no layout figura</title>
<meta name="unidade" content="ime">
<meta name="disciplina" content="Fixture de diagramas">
<meta name="aula" content="2b">
<meta name="data" content="2026-09-28">
<meta name="professor" content="Prof. Renato Vicente">
<script src="../../../dist/aula-usp.js"></script>
</head>
<body>

<section data-layout="capa">
  <h1>Diagrama alto</h1>
</section>

<section data-layout="abertura" id="direcao-do-sistema" data-curto="Sistema">
  <h2>A direção do sistema</h2>
</section>

<section data-layout="figura" id="cadeia-padrao">
  <h2>Uma cadeia de dez nós, na direção do sistema</h2>
  <figure class="diagrama">
    <script type="text/vnd.graphviz">digraph { a -> b -> c -> d -> e -> f -> g -> h -> i -> j; }</script>
  </figure>
  <aside class="notas">N.</aside>
</section>

<section data-layout="abertura" id="direcao-do-autor" data-curto="Autor">
  <h2>A direção do autor</h2>
</section>

<section data-layout="figura" id="cadeia-vertical">
  <h2>A mesma cadeia, de cima para baixo</h2>
  <figure class="diagrama">
    <script type="text/vnd.graphviz">digraph { rankdir=TB; a -> b -> c -> d -> e -> f -> g -> h -> i -> j; }</script>
  </figure>
  <aside class="notas">N.</aside>
</section>

<section data-layout="encerramento">
  <h2>Fim</h2>
  <ol class="sintese"><li>Um diagrama alto encolhe pela altura.</li></ol>
</section>

</body>
</html>
