<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fixture da captura: o erro de uma demo não é da outra</title>
<meta name="unidade" content="ime">
<meta name="disciplina" content="Fixture da captura">
<meta name="aula" content="1">
<meta name="data" content="2026-09-28">
<meta name="professor" content="Prof. Renato Vicente">
<script src="../../../../dist/aula-usp.js"></script>
</head>
<body>

<section data-layout="capa">
  <h1>Atribuição de erro</h1>
</section>

<section data-layout="demo" id="ruidosa">
  <h2>Uma demo que lança 400 ms depois de iniciar</h2>
  <div class="demo" data-demo="ruidosa" data-captura-ms="100"></div>
  <aside class="notas">Desenha e deixa um timer vivo, sem parar(): o erro dele cai depois da própria espera.</aside>
</section>

<section data-layout="demo" id="boa">
  <h2>Uma demo limpa</h2>
  <div class="demo" data-demo="boa" data-captura-ms="1000"></div>
  <aside class="notas">Não lança nada: se o build a recusa, o erro é de outra demo.</aside>
</section>

<section data-layout="encerramento">
  <h2>Fim</h2>
  <ol class="sintese">
    <li>O erro de uma demo é dela.</li>
  </ol>
</section>

<script>
AulaUSP.demo('ruidosa', {
  montar(raiz) {
    AulaUSP.controles.leitura(raiz, 1);
  },
  iniciar() {
    setTimeout(() => { null.x; }, 400);
  },
});
AulaUSP.demo('boa', {
  montar(raiz) {
    AulaUSP.controles.leitura(raiz, 2);
  },
});
</script>

</body>
</html>
