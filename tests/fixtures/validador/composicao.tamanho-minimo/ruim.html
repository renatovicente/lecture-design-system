<!-- Medido (revisão final do 4c, I4): a versão anterior usava <sub>, que está literalmente em
     contrato.papeis.excecoes — a regra nunca chega a medi-lo, então não é o mecanismo certo para
     ilustrar composicao.tamanho-minimo. Isto aqui mostra o mecanismo de verdade (um papel — leitura,
     mínimo 24 px — forçado abaixo do próprio mínimo), mas continua fora do alcance de um autor real:
     o vocabulário sancionado não tem como escolher font-size, e nenhuma classe do sistema produz um
     papel abaixo do seu próprio mínimo. style="" só existe aqui para exercitar a regra; ele também
     aciona vocabulario.style, de propósito — outra regra, outro achado. -->
