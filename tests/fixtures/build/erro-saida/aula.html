<body>

<section data-layout="capa">
  <h1>Referência externa</h1>
</section>

<section data-layout="abertura" id="um">
  <h2>Tópico</h2>
</section>

<!-- https:// (não http://) porque contrato.html.atributos.img.src só aceita img/..., data:image/...
     ou https:// (validador/regras/vocabulario.js) — um http:// puro falha vocabulario.atributo na
     etapa 1, e imagensDoDisco (build/carregar.mjs) trataria como caminho local e falharia
     recursos.imagem também: os dois terminariam esta fixture no final "erro estático", nunca
     alcançando saida.referencia-externa. 127.0.0.1:1 (porta reservada, sem processo escutando) para
     o Chrome recusar a conexão na hora nas etapas 5 e 6 — sem DNS, sem timeout de rede: só a pilha
     TCP do próprio sistema respondendo "recusado", https ou não (a recusa acontece antes de
     qualquer TLS). Spec 5.5 permite referência externa de propósito (por isso só um AVISO de
     recursos.imagem-externa na etapa 1); saida.referencia-externa, na etapa 7, é quem acusa como
     erro a mesma referência, depois de construir() (etapas 2-4) deixá-la propositalmente não
     embutida. -->
<section data-layout="conteudo" id="com-imagem-externa">
  <h2>Imagem de fora</h2>
  <figure>
    <img src="https://127.0.0.1:1/logo.png" alt="Logo externo, de propósito (spec 5.5)">
    <figcaption>saida.referencia-externa deve acusar esta linha, na etapa 7.</figcaption>
  </figure>
</section>

<section data-layout="encerramento">
  <h2>Fim</h2>
  <ol class="sintese">
    <li>O HTML e o PDF devem gravar; só a validação final acusa.</li>
  </ol>
</section>

</body>
</html>
