<!-- Tag relativa, como tests/fixtures/painel/demo.html: servida crua, carrega o pacote de dist/ deste
     repositório (tests/integracao/graficos-csv.test.mjs); servida por criarServidor, vira o runtime de
     desenvolvimento. O CSV é de data/erro.csv, ao lado deste arquivo — o exemplo literal da spec 7.2. -->
<script src="../../../dist/aula-usp.js"></script>
</head>
<body>
<section data-layout="capa"><h1>Capa</h1></section>
<section data-layout="abertura" id="um"><h2>Um</h2></section>
<section data-layout="figura" id="erro">
  <h2>Erro ao longo das épocas</h2>
  <figure class="grafico">
    <script type="application/json">
    { "tipo": "linha", "dados": "data/erro.csv", "x": "epoca", "y": ["treino", "teste"], "foco": "teste",
      "eixos": { "x": "época", "y": "erro" }, "faixas": [{ "x": [120, 245], "rotulo": "platô" }] }
    </script>
    <figcaption>Erro de treino e de teste ao longo das épocas.</figcaption>
  </figure>
  <aside class="notas">O CSV mora em data/, ao lado da aula.</aside>
</section>
<section data-layout="abertura" id="dois"><h2>Dois</h2></section>
<section data-layout="encerramento"><h2>Fim</h2><ol class="sintese"><li>Um.</li></ol></section>
</body>
